name: Demo precios Steam

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar Steam (cc=bo)
        run: python scripts/demo_steam.py | tee data/demo_salida.txt
      - name: Guardar resultado en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/demo_resultado.json data/demo_salida.txt
          git commit -m "Demo: resultado de precios Steam" || echo "Sin cambios"
          git push
