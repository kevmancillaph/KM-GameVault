name: Actualizar precios

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar Steam (Bolivia, USD)
        run: python scripts/actualizar_precios.py
      - name: Consultar otras tiendas (ITAD)
        continue-on-error: true
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
        run: python scripts/actualizar_otras.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios.json data/base.json
          git add data/otras.json data/itad_ids.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Precios $(date -u +%F)"
          git push
